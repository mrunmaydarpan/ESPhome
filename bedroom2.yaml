substitutions:
  room_name: Bedroom 2
  
esphome:
  name: bedroom2
  friendly_name: $room_name
  area: Bedroom 2
  comment: "MDtronix 4ch Smart Switch"
  project:
    name: "MDtronix.4ch Smart Switch"
    version: "3.0"
  on_boot:
    priority: 600
    then:
      - text_sensor.template.publish:
          id: restart_reason_id
          state: !lambda "return std::string(ESP.getResetReason().c_str());"

esp8266:
  board: esp8285

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}
  fast_connect: True
  min_auth_mode: WPA2

captive_portal:
logger:
  level: INFO
api: 
ota:
  - platform: esphome
web_server:
  version: 3
# debug:

mqtt:
  broker: 192.168.0.100
  username: homeassistant
  password: darkmaster
  discover_ip: False
  discovery: false
  id: mqtt_client
  
output:
  - platform: gpio
    pin: 12
    id: relay_1
  - platform: gpio
    pin: 14
    id: relay_2
  - platform: gpio
    pin: 0
    id: relay_3
  - platform: gpio
    pin: 2
    id: relay_4

light:
  - platform: binary
    output: relay_1
    name: Backyard Light
    id: light_1
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: binary
    output: relay_2
    name: Tube Light
    id: light_2
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: binary
    output: relay_3
    name: Bulb
    id: light_3
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: status_led
    pin: 16
    id: status_led_id

fan:
  - platform: template
    speed_count: 6
    name: Fan
    id: fan_1
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - output.turn_on: relay_4
    on_turn_off:
      - output.turn_off: relay_4  
    on_speed_set:
      lambda: |-
        if(id(fan_1).state) {
          const char* d = nullptr;
          const char* l = nullptr;
          switch(id(fan_1).speed) {
            case 1: d = "0xCFD12E"; l = "0xF38B74"; break;
            case 2: d = "0xCF09F6"; l = "0xF3906F"; break;
            case 3: d = "0xCF51AE"; l = "0xF38A75"; break;
            case 4: d = "0xCFC936"; l = "0xF3936C"; break;
            case 5: d = "0xCF11EE"; l = "0xF38877"; break;
            case 6: d = "0xCFF10E"; l = "0xF38F70"; break;
          }
          if (d && l) {
            char buf[128];
            snprintf(buf, sizeof(buf), "{\"Protocol\":\"NEC\",\"Bits\":32,\"Data\":\"%s\",\"DataLSB\":\"%s\",\"Repeat\":0}", d, l);
            id(mqtt_client).publish("cmnd/irblaster/IRSend", buf);
          }
        }
binary_sensor:  
  - platform: gpio
    id: switch_1
    pin:
      number: 5
      mode: INPUT_PULLUP
      inverted: true
    on_state:
      - light.toggle: light_1
      
  - platform: gpio
    id: Switch_2
    pin:
      number: 4
      mode: INPUT_PULLUP
      inverted: true
    on_state:
      - light.toggle: light_2
    
  - platform: gpio
    id: Switch_3
    pin:
      number: 13
      mode: INPUT_PULLUP
      inverted: true
    on_state:
      - light.toggle: light_3
      
  - platform: gpio
    id: Switch_4
    pin:
      number: 10
      mode: INPUT_PULLUP
      inverted: true
    on_state:
      - fan.toggle: fan_1

text_sensor:
  - platform: template
    name: "Restart Reason"
    icon: mdi:restart
    entity_category: diagnostic
    id: restart_reason_id
    update_interval: never
    lambda: |-
      return {ESP.getResetReason().c_str()};
  - platform: wifi_info
    ip_address: 
      name: IP

button:
  - platform: restart
    name: restart