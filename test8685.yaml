esphome:
  name: test
  platformio_options:
    board_build.partitions: 'D:/DEV/ESPhome/partitions_2mb.csv'

esp32:
  board: esp32-c3-devkitm-1
  flash_size: 2MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_COMPILER_OPTIMIZATION_SIZE: y
      CONFIG_NEWLIB_NANO_FORMAT: y # Saves ~25-50 KB
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}
  min_auth_mode: WPA

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG
captive_portal:
api:
ota:
  - platform: esphome
web_server: