substitutions:
  relay1_pin: GPIO12
  switch1_pin: GPIO14
  statusled_pin: GPIO2

esphome:
  name: garage
  friendly_name: garage
  comment: "MDtronix 1ch Smart Switch"
  project:
    name: "MDtronix.1ch smart switch"
    version: "1.0"
  on_boot:
    priority: 600
    then:
      - text_sensor.template.publish:
          id: restart_reason_id
          state: !lambda "return std::string(ESP.getResetReason().c_str());"

esp8266:
  board: esp8285

logger:
  level: INFO
api:
# mqtt:
#   broker: homeassistant.local
#   username: hassio
#   password: darkmaster
#   id: mqtt_client
# debug:  
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}
  min_auth_mode: WPA2
  
captive_portal:
web_server:

output:
  - platform: gpio
    pin: $relay1_pin
    id: relay1_id

light:
  - platform: binary
    output: relay1_id
    id: light_id
    name: Light

binary_sensor:
  - platform: gpio
    pin:
      number: $switch1_pin
      mode: INPUT_PULLUP
      inverted: True
    id: switch_id
    on_state:
      light.toggle: light_id

status_led:
  pin: $statusled_pin

text_sensor:
  # - platform: debug
  #   reset_reason:
  #     name: "Reset Reason"
  - platform: wifi_info
    ip_address:
      name: IP
      icon: mdi:ip      
  - platform: template
    name: "Restart Reason"
    icon: mdi:restart
    entity_category: diagnostic
    id: restart_reason_id
    update_interval: never
    lambda: |-      
      return {ESP.getResetReason().c_str()};    

button:
  - platform: restart
    name: restart