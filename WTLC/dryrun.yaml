globals:
  - id: dryrun_state
    type: bool
    initial_value: "false"

  - id: dryrun_last_dist
    type: float

interval:
  - interval: $dryrun_interval
    id: dryrun_check_timer
    startup_delay: $dryrun_interval
    then:
      - lambda: |-
          if(id(pump_id).state)
          {
            ESP_LOGW("DRYRUN", "Checking dryrun timer in every %s", "$dryrun_interval");
          } 
          else
          {
            id(dryrun_check_timer).stop_poller();
          }
      - if:
          condition:
            and:
              - switch.is_on: dryrun_id
              - switch.is_on: pump_id
          then:
            - lambda: |-
                ESP_LOGI("DRYRUN", "Checking for Dryrun >> current: %.0f cm | last: %.0f cm", id(sensor_id).state, id(dryrun_last_dist));
                if(id(sensor_id).state >= id(dryrun_last_dist) || isnan(id(dryrun_last_dist)))
                {
                  ESP_LOGE("DRYRUN", "Dryrun detected, turning off pump");
                  id(dryrun_last_dist) = id(sensor_id).state;
                  id(dryrun_state) = true;
                  id(oled_dryrun_page).show();
                  id(pump_id).turn_off();
                }
                else
                {
                  id(dryrun_last_dist) = id(sensor_id).state;
                }
