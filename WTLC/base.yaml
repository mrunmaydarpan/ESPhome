esphome:
  name: wtlc
  friendly_name: WTLC
  project:
    name: "MDtronix.WTLC"
    version: "HW v9.0"
  on_boot:
    - priority: 800
      then:
        - lambda: |-
            pinMode(${relay_1_pin}, OUTPUT);
            pinMode(${led_pin}, OUTPUT);
        # - component.suspend: dryrun_check_timer    

    - priority: -100
      then:
        - delay: 3s
        - binary_sensor.template.publish:
            id: sensor_state_id
            state: false
        - lambda: |-
            if(id(pump_id).state)
            {
              id(dryrun_check_timer).stop_poller();
            }
esp8266:
  board: esp12e
  restore_from_flash: true

# debug:
api:
  on_client_connected: 
    then: 
      - text_sensor.template.publish:
          id: restart_reason_id
          state: !lambda 'return ESP.getResetReason().c_str();'
      
logger:
# ota:
    
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA
  ap: {}
  fast_connect: true
  manual_ip: 
    static_ip: 192.168.0.129
    gateway: 192.168.0.1
    subnet: 255.255.255.0
  on_connect:
    then:
      - if:
          condition:
            lambda: return digitalRead(${relay_1_pin});
          then:
            light.turn_on: led_id
          else:
            light.turn_off: led_id

captive_portal:
web_server:
  version: 3