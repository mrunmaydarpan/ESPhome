interval:
  - interval: $sensor_check_interval
    id: sensor_check_timer
    startup_delay: $sensor_check_interval
    then:
      - component.update: oled_id
      - if:
          condition:
            or:
              - lambda: return isnan(id(sensor_id).state);
              - lambda: return id(sensor_id).state <= 0;
          then:
            - binary_sensor.template.publish:
                id: sensor_state_id
                state: true
            - lambda: |-
                ESP_LOGE("SENSOR", "Sensor %s", isnan(id(sensor_id).state)? "cable or sensor issue" : "face blocked");
            - display.page.show: oled_error_page
          else:
            - binary_sensor.template.publish:
                id: sensor_state_id
                state: false
            # - lambda: id(page) = "oled_level_page";
            - lambda: |-
                if(id(dryrun_state))
                {
                  id(oled_dryrun_page).show();
                }
                else
                {
                  id(oled_level_page).show();
                }
            - logger.log:
                tag: SENSOR
                level: info
                format: "sensor ok >> %0.0f cm"
                args: [ 'id(sensor_id).state' ]
