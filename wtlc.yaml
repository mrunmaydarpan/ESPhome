substitutions:
  tank_height: 100
  full_tank_distance: 10
  dryrun_interval: 5 # minutes
  sensor_check_interval: 10s

esphome:
  name: wtlc
  friendly_name: WTLC
  project:
    name: "MDtronix.WTLC"
    version: "HW v9.0"
  on_boot:
    - priority: 800
      then:
        - lambda: |-
            pinMode(${relay_1_pin}, OUTPUT);
            pinMode(${led_pin}, OUTPUT);
        - wait_until:
            - lambda: return !isnan(id(sensor_id).state);
        - binary_sensor.template.publish:
            id: sensor_state_id
            state: false
        - binary_sensor.template.publish:
            id: dryrun_state_id
            state: false

esp8266:
  board: esp12e
  framework:
    version: recommended
  restore_from_flash: true

preferences:
  flash_write_interval: 10s
# debug:
api:
  on_client_connected:
    then:
      - text_sensor.template.publish:
          id: restart_reason_id
          state: !lambda "return ESP.getResetReason().c_str();"

# ota:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA
  ap: {}
  fast_connect: true
  manual_ip:
    static_ip: 192.168.0.129
    gateway: 192.168.0.1
    subnet: 255.255.255.0

captive_portal:
# web_server:
#   version: 3

logger:
  level: DEBUG
  logs:
    sensor: NONE

uart:
  baud_rate: 9600
  rx_pin: $srx_pin
  tx_pin: $stx_pin
  id: uart_id

packages:
  pins: !include WTLC/pins.yaml
  display: !include WTLC/display.yaml
  sensors: !include WTLC/sensors.yaml
  dryrun: !include WTLC/dryrun.yaml
  # intervals: !include WTLC/intervals.yaml
  switches: !include WTLC/switches.yaml
  # binary_sensor: !include WTLC/binary_sensors.yaml

#########################################################################################

light:
  - platform: status_led
    id: led_id
    pin:
      number: $led_pin
      inverted: False

#########################################################################################

text_sensor:
  # - platform: wifi_info
  #   ip_address:
  #     name: IP
  #     icon: mdi:ip

  - platform: template
    name: "Restart Reason"
    icon: mdi:restart
    entity_category: diagnostic
    id: restart_reason_id
    update_interval: never
    # lambda: return { ESP.getResetReason().c_str() };

  - platform: template
    name: "Pump Last Reason"
    icon: mdi:water-pump
    entity_category: diagnostic
    id: pump_last_reason_id
    update_interval: never

#########################################################################################

# output:
#   - platform: esp8266_pwm
#     id: rtttl_out
#     pin:
#       number: $buzzer_pin
#       inverted: False
#     # frequency: 2000 Hz

#########################################################################################

# rtttl:
#   output: rtttl_out
#   id: buzz_id
#   gain: 10%

#########################################################################################

number:
  - platform: template
    name: "Start Pump at"
    id: start_pump_id
    optimistic: true
    restore_value: yes
    min_value: 10
    max_value: 50
    step: 5
    unit_of_measurement: "%"
    icon: "mdi:water-check"
    initial_value: 10
    entity_category: "config"

  - platform: template
    name: "Stop Pump at"
    id: stop_pump_id
    optimistic: true
    restore_value: True
    min_value: 70
    max_value: 100
    step: 5
    unit_of_measurement: "%"
    icon: "mdi:water-check"
    initial_value: 100
    entity_category: "config"

#########################################################################################

button:
  - platform: restart
    name: Restart
    id: restart_id
    entity_category: "diagnostic"

#########################################################################################

binary_sensor:
  - platform: gpio
    pin:
      number: $mode_pin
      mode: INPUT_PULLUP
      inverted: True
    id: mode_button_id
    on_release:
      then:
        - switch.toggle: mode_id
        - binary_sensor.template.publish:
            id: dryrun_state_id
            state: false

  - platform: gpio
    id: pump_button_id
    pin:
      number: $button_pin
      mode: INPUT_PULLUP
      inverted: True
    on_press:
      then:
        - switch.toggle: pump_id

#########################################################################################

interval:
  - interval: 500ms
    then:
      - wait_until:
          condition:
            - and:
                # - lambda: return !isnan(id(sensor_id).state);
                - api.connected:
      - lambda: |-
          if(id(dryrun_state_id).state || id(sensor_state_id).state)
          {
            digitalWrite($led_pin, !digitalRead($led_pin));
          }
          else
          {
            digitalWrite($led_pin, digitalRead($relay_1_pin));
          }



