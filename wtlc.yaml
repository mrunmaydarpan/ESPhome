substitutions:
  tank_height: 110
  full_tank_distance: 15
  OTA_URL: https://raw.githubusercontent.com/mrunmaydarpan/ESPhome/dev/OTA/WTLC/firmware.ota.bin
  OTA_MD5: "03d7a3d96ee69953d4626af09d53b6b0"
  # dryrun_interval: 3 # minutes
  # sensor_check_interval: 5s

esphome:
  name: wtlc
  friendly_name: WTLC
  project:
    name: "MDtronix.WTLC"
    version: "HW v9.0"
  on_boot:
    - priority: 800
      then:
        - lambda: |-
            pinMode(${relay_1_pin}, OUTPUT);
            pinMode(${led_pin}, OUTPUT);
        - display.page.show: oled_splash_page
        - delay: 3s
        - wait_until:
            condition:
              lambda: return !isnan(id(sensor_id).state);
            timeout: 3s
        - display.page.show: oled_level_page
        - if:
            condition:
              lambda: 'return id(pump_last_reason_persisted) != "";'
            then:
              - text_sensor.template.publish:
                  id: pump_last_reason_id
                  state: !lambda "return id(pump_last_reason_persisted);"

        # - wait_until:
        #     - lambda: return !isnan(id(sensor_id).state);
        # - binary_sensor.template.publish:
        #     id: sensor_state_id
        #     state: false
        # - binary_sensor.template.publish:
        #     id: dryrun_state_id
        #     state: false

esp8266:
  board: esp12e
  framework:
    version: recommended
  restore_from_flash: true

preferences:
  flash_write_interval: 1min
# debug:
api:
  on_client_connected:
    then:
      - text_sensor.template.publish:
          id: restart_reason_id
          state: !lambda "return ESP.getResetReason().c_str();"

http_request:
  verify_ssl: false

ota:
  - platform: esphome
    id: ota_id
    on_progress:
      then:
        - lambda: |-
            id(ota_progress) = x;  // store progress percentage
            id(oled_id).update();
        - display.page.show: oled_ota_page
    on_end:
      then:
        - logger.log: "OTA completed"
        - lambda: id(oled_id)->update();
  - platform: http_request
    id: http_request_id
    on_begin: 
      then:
        - logger.log: "HTTP Request Begin"
    on_end:
      then:
        - logger.log: "HTTP Request End"
    
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA
  ap: {}

captive_portal:
# web_server:
#   version: 3
dashboard_import:
  package_import_url: github://mrunmaydarpan/ESPhome/wtlc.yaml@dev
  import_full_config: False

logger:
  level: DEBUG
  logs:
    sensor: NONE

uart:
  baud_rate: 9600
  rx_pin: $srx_pin
  tx_pin: $stx_pin
  id: uart_id

i2c:
  frequency: 400khz
  scan: false

time:
  - platform: sntp
    id: sntp_time
    timezone: "IST-5:30" # Assuming IST based on local time +05:30
    on_time:
      - seconds: 0
        minutes: 0
        hours: 6
        then:
          - if:
              condition:
                and:
                  - switch.is_on: mode_id
                  - switch.is_off: pump_id
                  - binary_sensor.is_off: sensor_state_id
                  - binary_sensor.is_off: dryrun_state_id
                  - binary_sensor.is_off: is_quiet_hours_id
                  - lambda: return id(water_level_id).state <= id(start_pump_id).state;
              then:
                - switch.turn_on: pump_id
                - lambda: |-
                    id(pump_last_reason_persisted) = "Auto Start (6AM)";
                    id(pump_last_reason_id).publish_state("Auto Start (6AM)");
                - logger.log: "Morning resumption: Starting pump as level is low."

packages:
  pins: !include WTLC/pins.yaml
  # display: !include WTLC/display.yaml
  # sensors: !include WTLC/sensors.yaml
  # dryrun: !include WTLC/dryrun.yaml
  # intervals: !include WTLC/intervals.yaml
  # switches: !include WTLC/switches.yaml
  # binary_sensor: !include WTLC/binary_sensors.yaml

#########################################################################################

globals:
  - id: dryrun_last_dist
    type: float

  - id: last_dryrun_ts
    type: unsigned long
    initial_value: "0"

  - id: dryrun_persisted
    type: bool
    restore_value: yes
    initial_value: "false"

  - id: pump_last_reason_persisted
    type: std::string
    restore_value: yes
    initial_value: '""'
  - id: ota_progress
    type: float
    restore_value: no
    initial_value: "0"

  - id: splash_flag
    type: bool
    restore_value: no
    initial_value: "false"
  - id: last_sensor_ts
    type: unsigned long
    initial_value: "0"

  - id: pump_start_ms
    type: unsigned long
    initial_value: "0"

light:
  - platform: status_led
    id: led_id
    pin:
      number: $led_pin
      inverted: False

#########################################################################################

text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP
      icon: mdi:ip

  - platform: template
    name: "Restart Reason"
    icon: mdi:restart
    entity_category: diagnostic
    id: restart_reason_id
    update_interval: never
    # lambda: return { ESP.getResetReason().c_str() };

  - platform: template
    name: "Pump Last Reason"
    icon: mdi:water-pump
    entity_category: diagnostic
    id: pump_last_reason_id
    update_interval: never

#########################################################################################

# output:
#   - platform: esp8266_pwm
#     id: rtttl_out
#     pin:
#       number: $buzzer_pin
#       inverted: False
#     # frequency: 2000 Hz

#########################################################################################

# rtttl:
#   output: rtttl_out
#   id: buzz_id
#   gain: 10%

#########################################################################################

font:
  - file: "gfonts://Roboto"
    id: font1
    size: 14
  - file: "gfonts://Roboto"
    id: font2
    size: 45
  - file: "gfonts://Roboto"
    id: font3
    size: 24
image:
  defaults:
    type: binary
    resize: 128x64
  images:
    - file: "WTLC/logo.png"
      id: logo

    - file: "WTLC/alert.png"
      id: alert

    - file: "WTLC/dryrun.png"
      id: dryrun
display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    id: oled_id
    address: 0x3C
    pages:
      - id: oled_splash_page
        lambda: it.image(0, 0, id(logo));

      - id: oled_level_page
        lambda: |-
          it.printf(10, 0, id(font1), "%s", id(mode_id).state? "AUTO" : "MANUAL");
          it.printf(108, 13, id(font2), TextAlign::RIGHT, "%0.0f", id(water_level_id).state);
          it.printf(110, 32, id(font3), "%%");
          if (id(pump_id).state) {
            it.printf(128, 0, id(font1), TextAlign::RIGHT, "R:%.1fm", id(pump_run_time_sensor_id).state);
          }

      - id: oled_ota_page
        lambda: |-
          float p = id(ota_progress);
          if (p < 0 || p > 100) p = 0;
          it.printf(05, 0, id(font1), "UPDATING: %0.0f%%", p);
          it.rectangle(05, 20, it.get_width() - 10, 20);
          int bar_width = (int)((it.get_width() - 12) * p / 100.0f);
          it.filled_rectangle(6, 21, bar_width, 18);

      - id: oled_error_page
        lambda: it.image(0, 0, id(alert));

      - id: oled_dryrun_page
        lambda: it.image(0, 0, id(dryrun));

#########################################################################################

number:
  - platform: template
    name: "Start Pump at"
    id: start_pump_id
    optimistic: true
    restore_value: yes
    min_value: 10
    max_value: 70
    step: 5
    unit_of_measurement: "%"
    icon: "mdi:water-check"
    initial_value: 10
    entity_category: "config"

  - platform: template
    name: "Stop Pump at"
    id: stop_pump_id
    optimistic: true
    restore_value: True
    min_value: 75
    max_value: 100
    step: 5
    unit_of_measurement: "%"
    icon: "mdi:water-check"
    initial_value: 100
    entity_category: "config"

  - platform: template
    name: "Dry Run Interval"
    id: dryrun_interval_id
    optimistic: true
    restore_value: yes
    min_value: 1
    max_value: 10
    step: 1
    unit_of_measurement: "min"
    icon: "mdi:timer-sand"
    initial_value: 1
    entity_category: "config"

  - platform: template
    name: "Max Pump Run Time"
    id: max_pump_run_time_id
    optimistic: true
    restore_value: yes
    min_value: 1
    max_value: 60
    step: 1
    unit_of_measurement: "min"
    icon: "mdi:clock-alert"
    initial_value: 15
    entity_category: "config"

#########################################################################################

button:
  - platform: restart
    name: Restart
    id: restart_id
    entity_category: "diagnostic"

#########################################################################################

binary_sensor:
  - platform: gpio
    pin:
      number: $mode_pin
      mode: INPUT_PULLUP
      inverted: True
    id: mode_button_id
    on_click:
      - min_length: 50ms
        max_length: 500ms
        then:
          - switch.toggle: mode_id
          - lambda: |-
              id(dryrun_persisted) = false;
          - binary_sensor.template.publish:
              id: dryrun_state_id
              state: false
      - min_length: 5s
        max_length: 10s
        then:
          - logger.log: "Starting OTA update from button press..."
          - ota.http_request.flash:
              url: ${OTA_URL}
              md5: ${OTA_MD5}

  - platform: template
    id: dryrun_state_id
    name: DryRun
    device_class: problem
    entity_category: diagnostic
    lambda: |-
      return id(dryrun_persisted);

  - platform: gpio
    id: pump_button_id
    pin:
      number: $button_pin
      mode: INPUT_PULLUP
      inverted: True
    on_press:
      then:
        - switch.toggle: pump_id

  - platform: template
    id: sensor_state_id
    name: Sensor
    device_class: problem
    entity_category: diagnostic

  - platform: template
    id: is_quiet_hours_id
    name: "Quiet Hours"
    lambda: |-
      auto now = id(sntp_time).now();
      return id(safety_mode_id).state && now.is_valid() && (now.hour >= 23 || now.hour < 6);

#########################################################################################

sensor:
  # - platform: template
  - platform: a02yyuw
    name: "Distance"
    id: sensor_id
    uart_id: uart_id
    unit_of_measurement: cm
    accuracy_decimals: 0
    entity_category: "diagnostic"
    device_class: "distance"
    filters:
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1
      - throttle: 1s
      - multiply: 0.1
    on_value:
      then:
        - lambda: |-
            id(last_sensor_ts) = millis();
            id(sensor_state_id).publish_state(false);
    on_value_range:
      below: $full_tank_distance
      then:
        - if:
            condition:
              - switch.is_on: pump_id
            then:
              - switch.turn_off: pump_id
              - logger.log:
                  tag: "SENSOR"
                  level: warn
                  format: "High level (%.0f cm), turning pump OFF"
                  args: [id(sensor_id).state]

  - platform: template
    id: water_level_id
    accuracy_decimals: 0
    unit_of_measurement: "%"
    update_interval: 1s
    icon: mdi:water-percent
    name: Level
    filters:
      - calibrate_linear:
          - ${full_tank_distance} -> 100.0
          - ${tank_height} -> 0.0
      - clamp:
          min_value: 0.0
          max_value: 100.0
          ignore_out_of_range: False
      - median: # Robust spike rejection and smoothing
          window_size: 7
          send_every: 1
          send_first_at: 1

    lambda: |-
      if (id(sensor_id).has_state()) {
        ESP_LOGD("SENSOR", "Distance: %.0f cm | Level: %.0f%%", id(sensor_id).state, id(water_level_id).state);
        return id(sensor_id).state;
      }
      return {}; // Return NAN (Not a Number) if sensor has no state

    on_value_range:
      - below: !lambda return id(start_pump_id).state;
        then:
          - if:
              condition:
                and:
                  - switch.is_on: mode_id
                  - switch.is_off: pump_id
                  - binary_sensor.is_off: sensor_state_id
                  - binary_sensor.is_off: dryrun_state_id
                  - binary_sensor.is_off: is_quiet_hours_id
              then:
                - switch.turn_on: pump_id
                - lambda: |-
                    id(pump_last_reason_persisted) = "Auto Start";
                    id(pump_last_reason_id).publish_state("Auto Start");
                - logger.log:
                    tag: "water_level"
                    level: warn
                    format: "Water level below start threshold, turning pump ON."

      - above: !lambda return id(stop_pump_id).state;
        then:
          - if:
              condition:
                - switch.is_on: pump_id
              then:
                - switch.turn_off: pump_id
                - logger.log:
                    tag: "water_level"
                    level: warn
                    format: "Water level above stop threshold, turning OFF pump"
                - lambda: |-
                    id(pump_last_reason_persisted) = "Auto Stop";
                    id(pump_last_reason_id).publish_state("Auto Stop");

  - platform: template
    name: "Pump Run Time"
    id: pump_run_time_sensor_id
    unit_of_measurement: "min"
    accuracy_decimals: 1
    icon: "mdi:timer-outline"
    update_interval: 10s
    lambda: |-
      if (id(pump_id).state) {
        return (millis() - id(pump_start_ms)) / 60000.0f;
      }
      return 0.0f;

#########################################################################################

script:
  - id: pump_safety_timeout
    mode: restart
    then:
      - delay: !lambda "return id(max_pump_run_time_id).state * 60000;"
      - if:
          condition:
            switch.is_on: pump_id
          then:
            - switch.turn_off: pump_id
            - lambda: |-
                id(pump_last_reason_persisted) = "Timeout Safety";
                id(pump_last_reason_id).publish_state("Timeout Safety");
            - logger.log: "Pump shut down due to run-time safety limit"

switch:
  - platform: template
    id: pump_id
    name: Pump
    icon: mdi:pump
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

    on_turn_on:
      then:
        - lambda: |-
            id(pump_start_ms) = millis();
            id(last_dryrun_ts) = millis();
            digitalWrite($relay_1_pin, HIGH);
            digitalWrite($led_pin, HIGH);
            id(dryrun_persisted) = false;
            id(dryrun_state_id).publish_state(false);
        - if:
            condition:
              switch.is_on: safety_mode_id
            then:
              - script.execute: pump_safety_timeout
    turn_on_action:
      then:
        - lambda: |-
            id(pump_last_reason_persisted) = "user";
            id(pump_last_reason_id).publish_state("user");

    on_turn_off:
      then:
        - lambda: |-
            digitalWrite($relay_1_pin, LOW);
            digitalWrite($led_pin, LOW);
        - script.stop: pump_safety_timeout
    # turn_off_action:
    #   then:
    #     - lambda: |-
    #         id(pump_last_reason_id).publish_state("user");

  - platform: template
    id: mode_id
    name: Automatic Mode
    icon: mdi:flash-auto
    optimistic: True
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    on_turn_on:
      lambda: |-
        if(id(is_quiet_hours_id).state == false && id(water_level_id).state <= id(start_pump_id).state)
        {
          id(pump_id).turn_on();
          id(pump_last_reason_persisted) = "Auto Start";
          id(pump_last_reason_id).publish_state("Auto Start");
        }


  - platform: template
    id: dryrun_id
    optimistic: True
    name: DryRun
    icon: mdi:water-remove
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: "config"

  - platform: template
    id: safety_mode_id
    name: Safety Mode
    icon: mdi:shield-check
    optimistic: True
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config

interval:
  - interval: 500ms
    then:
      - wait_until:
          condition:
            - api.connected
          timeout: 10s
      - lambda: |-
          if(id(dryrun_state_id).state || id(sensor_state_id).state)
          {
            digitalWrite($led_pin, !digitalRead($led_pin));
          }
          else
          {
            digitalWrite($led_pin, digitalRead($relay_1_pin));
          }

  - interval: 1s
    # startup_delay: 15s
    then:
      - if:
          condition:
            and:
              - switch.is_on: dryrun_id
              - switch.is_on: pump_id
          then:
            - lambda: |-
                unsigned long now = millis();
                if(now - id(last_dryrun_ts) >= 60000 * id(dryrun_interval_id).state)
                {
                  id(last_dryrun_ts) = now;
                  float current_dist = id(sensor_id).state;
                  ESP_LOGI("DRYRUN", "Checking: current %.0f cm | last %.0f cm", current_dist, id(dryrun_last_dist));
                  
                  if(current_dist >= id(dryrun_last_dist) || isnan(id(dryrun_last_dist)))
                  {
                    ESP_LOGE("DRYRUN", "Dryrun detected!");
                    id(dryrun_persisted) = true;
                    id(dryrun_state_id).publish_state(true);
                    id(pump_id).turn_off();
                    id(pump_last_reason_persisted) = "dryrun";
                    id(pump_last_reason_id).publish_state("dryrun");
                    id(mode_id).turn_off();
                  }
                  id(dryrun_last_dist) = current_dist;
                }
      # This lambda checks if the sensor has stopped sending data.
      # It compares the current time with the timestamp of the last received value.
      # If more than 5 seconds have passed, it assumes a sensor error.
      - lambda: |-
          unsigned long now = millis();
          if (id(sensor_id).has_state() && now - id(last_sensor_ts) > 5000 || isnan(id(sensor_id).state))
          {
            if (id(sensor_state_id).state == false) {
              ESP_LOGE("SENSOR", "Sensor ERROR");
              id(sensor_state_id).publish_state(true);
              id(pump_id).turn_off();
              id(pump_last_reason_persisted) = "Sensor Error";
              id(pump_last_reason_id).publish_state("Sensor Error");
            }
          }

  - interval: 2s
    # startup_delay: 10s
    id: display_update_timer
    then:
      - lambda: |-
          if (id(dryrun_state_id).state) {
            id(oled_id).show_page(id(oled_dryrun_page));
          } else if (id(sensor_state_id).state) {
            id(oled_id).show_page(id(oled_error_page));
          } else {
            id(oled_id).show_page(id(oled_level_page));
          }