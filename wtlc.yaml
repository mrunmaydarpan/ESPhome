substitutions:
  tank_height: 100
  full_tank_distance: 10
  dryrun_interval: 1min
  sensor_check_interval: 10s

esphome:
  name: wtlc
  friendly_name: WTLC
  project:
    name: "MDtronix.WTLC"
    version: "HW v9.0"
  on_boot:
    - priority: 800
      then:
        - lambda: |-
            pinMode(${relay_1_pin}, OUTPUT);
            pinMode(${led_pin}, OUTPUT);
        # - component.suspend: dryrun_check_timer

    - priority: -100
      then:
        - delay: 3s
        - lambda: |-
            // Sync pump_state with the actual restored switch state
            id(sensor_state_id).publish_state(false);
            id(pump_state) = id(pump_id).state;
            if(id(pump_state))
            {
              id(pump_last_reason_id).publish_state("restored_on");
            }
            else
            {
              id(pump_last_reason_id).publish_state("restored_off");
              id(dryrun_check_timer).stop_poller();
            }
            
esp8266:
  board: esp12e
  restore_from_flash: true

preferences:
  flash_write_interval: 10s
# debug:
api:
  on_client_connected:
    then:
      - text_sensor.template.publish:
          id: restart_reason_id
          state: !lambda "return ESP.getResetReason().c_str();"

# ota:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA
  ap: {}
  fast_connect: true
  manual_ip:
    static_ip: 192.168.0.129
    gateway: 192.168.0.1
    subnet: 255.255.255.0
  on_connect:
    then:
      - if:
          condition:
            lambda: return digitalRead(${relay_1_pin});
          then:
            light.turn_on: led_id
          else:
            light.turn_off: led_id

captive_portal:
web_server:
  version: 3

logger:
  logs:
    sensor: NONE

packages:
  pins: !include WTLC/pins.yaml
  display: !include WTLC/display.yaml
  sensors: !include WTLC/sensors.yaml
  # base: !include WTLC/base.yaml
  dryrun: !include WTLC/dryrun.yaml
  # intervals: !include WTLC/intervals.yaml
  # switches: !include WTLC/switches.yaml
  # binary_sensor: !include WTLC/binary_sensors.yaml

#########################################################################################

globals:
  - id: var_sensor_state
    type: bool
    initial_value: "false"
  - id: pump_state
    type: bool
    initial_value: "false"
    restore_value: true

  # - id: ota_inProgress
  #   type: bool
  #   initial_value: 'false'

#########################################################################################

light:
  - platform: status_led
    id: led_id
    pin:
      number: $led_pin
      inverted: False

#########################################################################################

text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP
      icon: mdi:ip

  - platform: template
    name: "Restart Reason"
    icon: mdi:restart
    entity_category: diagnostic
    id: restart_reason_id
    update_interval: never
    # lambda: return { ESP.getResetReason().c_str() };

  - platform: template
    name: "Pump Last Reason"
    icon: mdi:water-pump
    entity_category: diagnostic
    id: pump_last_reason_id

#########################################################################################

# output:
#   - platform: esp8266_pwm
#     id: rtttl_out
#     pin:
#       number: $buzzer_pin
#       inverted: False
#     # frequency: 2000 Hz

#########################################################################################

# rtttl:
#   output: rtttl_out
#   id: buzz_id
#   gain: 10%

#########################################################################################

number:
  - platform: template
    name: "Start Pump at"
    id: start_pump_id
    optimistic: true
    restore_value: yes
    min_value: 10
    max_value: 50
    step: 10
    unit_of_measurement: "%"
    icon: "mdi:water-check"
    initial_value: 10
    entity_category: "config"

  - platform: template
    name: "Stop Pump at"
    id: stop_pump_id
    optimistic: true
    restore_value: True
    min_value: 70
    max_value: 100
    step: 10
    unit_of_measurement: "%"
    icon: "mdi:water-check"
    initial_value: 100
    entity_category: "config"

#########################################################################################

button:
  - platform: restart
    name: Restart
    id: restart_id
    entity_category: "diagnostic"

  - platform: factory_reset
    name: Factory Reset
    id: factory_reset_id
    entity_category: "diagnostic"

#########################################################################################

sensor:
  - platform: template
    id: sensor_id
    name: "Distance_UART"
    unit_of_measurement: "cm"
    device_class: distance
    accuracy_decimals: 0
    entity_category: "diagnostic"
    # update_interval: 1s
    filters:
      - throttle: 500ms
      # - timeout: 5s
    on_value:
      then:
        - component.update: water_level_id
        - lambda: |-
            ESP_LOGD("SENSOR", "Distance: %.0f cm | Water Level: %.0f%%", id(sensor_id).state, id(water_level_id).state);

  - platform: template
    id: water_level_id
    accuracy_decimals: 0
    unit_of_measurement: "%"
    # update_interval: 1s
    icon: mdi:water-percent
    name: Level
    # filters:
    #   - median: # Smooth out noise
    #       window_size: 7
    #       send_every: 3
    #       send_first_at: 1
    lambda: |-
      if (isnan(id(sensor_id).state)) return 0;
      // auto d = id(sensor_id).state;
      auto level = map(id(sensor_id).state, ${tank_height}, ${full_tank_distance}, 0, 100);
      if (level < 0) level = 0;
      if (level > 100) level = 100;
      return level;
    on_value_range:
      - below: !lambda return id(start_pump_id).state;
        then:
          - if:
              condition:
                and:
                  - switch.is_on: mode_id
                  - switch.is_off: pump_id
                  - binary_sensor.is_off: sensor_state_id
                  - binary_sensor.is_off: dryrun_state_id
              then:
                - switch.turn_on: pump_id
                - text_sensor.template.publish:
                    id: pump_last_reason_id
                    state: "Auto Start"
                - logger.log:
                    tag: "water_level"
                    level: warn
                    format: "Water level below start threshold, turning pump ON."

      - above: !lambda return id(stop_pump_id).state;
        then:
          - switch.turn_off: pump_id
          - logger.log:
              tag: "water_level"
              level: warn
              format: "Water level above stop threshold, turning OFF pump"
          - text_sensor.template.publish:
              id: pump_last_reason_id
              state: "Auto Stop"

#########################################################################################

binary_sensor:
  - platform: gpio
    pin:
      number: $mode_pin
      mode: INPUT_PULLUP
      inverted: True
    id: mode_button_id
    on_press:
      then:
        - switch.toggle: mode_id

  - platform: gpio
    id: pump_on_id
    pin:
      number: $button_pin
      mode: INPUT_PULLUP
      inverted: True
    on_press:
      then:
        - switch.toggle: pump_id

  - platform: template
    id: sensor_state_id
    name: Sensor
    device_class: problem
    entity_category: diagnostic
    # on_press:
    #   - globals.set:s
    #       id: page
    #       value: '"oled_error_page"'
    # on_release:
    #   - globals.set:
    #       id: page
    #       value: '"oled_level_page"'
  - platform: template
    id: dryrun_state_id
    name: DryRun
    device_class: problem
    entity_category: diagnostic
    lambda: |-
      return id(dryrun_state);

#########################################################################################

switch:
  - platform: template
    id: pump_id
    name: Pump
    icon: mdi:pump
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_off:
      - lambda: |-
          digitalWrite($relay_1_pin, LOW);
          digitalWrite($led_pin, LOW);
          id(pump_state) = false;
          ESP_LOGI("PUMP", "pump off");
          id(pump_last_reason_id).publish_state("user");
      - component.suspend: dryrun_check_timer
      - lambda: ESP_LOGW("DRYRUN", "Timer suspended");

    on_turn_on:
      then:
        - if:
            condition:
              and:
                - lambda: return id(sensor_id).state > ($full_tank_distance + 40);
                - lambda: return id(dryrun_state) == false;
            then:
              - lambda: |-
                  digitalWrite($relay_1_pin, HIGH);
                  digitalWrite($led_pin, HIGH);
                  ESP_LOGI("PUMP", "pump on");
                  ESP_LOGW("DRYRUN", "Timer resumed");
                  id(dryrun_last_dist) = id(sensor_id).state;
                  id(pump_state) = true;
                  id(pump_last_reason_id).publish_state("user");
              - delay: $dryrun_interval
              - component.resume: dryrun_check_timer
            else:
              - globals.set:
                  id: dryrun_state
                  value: "false"
              - display.page.show: oled_level_page
              - light.turn_off: led_id
              - delay: 1s
              - switch.turn_off: pump_id
              - lambda: ESP_LOGW("PUMP", "pump can't be turned on");

  - platform: template
    id: mode_id
    name: Automatic Mode
    icon: mdi:flash-auto
    optimistic: True
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    on_turn_on:
      then:
        - if:
            condition:
              lambda: return id(water_level_id).state < id(start_pump_id).state;
            then:
              - switch.turn_on: pump_id
              - text_sensor.template.publish:
                  id: restart_reason_id
                  state: "Auto Start"

  - platform: template
    id: dryrun_id
    optimistic: True
    name: DryRun
    icon: mdi:water-remove
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: "config"

interval:
  - interval: 500ms
    then:
      lambda: |-
        if(id(dryrun_state) || id(sensor_state_id).state)
        {
          digitalWrite($led_pin, !digitalRead($led_pin));
        }
