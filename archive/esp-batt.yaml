esphome:
  name: esp-batt
  friendly_name: esp-batt

esp8266:
  board: esp_wroom_02

logger:
  level: DEBUG
api:
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}
  manual_ip: 
    static_ip: 192.168.0.36
    gateway: 192.168.0.1
    subnet: 255.255.255.0
  min_auth_mode: WPA

captive_portal:
web_server:
  version: 3

sensor:
  - platform: adc
    pin: A0
    id: batt_volt_id
    name: "Battery Voltage"
    accuracy_decimals: 1
    device_class: voltage
    update_interval: 1s
    filters:
      # - throttle: 3s
      - multiply: 6.6 # Calibration factor based on divider ratio
      - median: # Remove peaks
          window_size: 7
          send_every: 3
      - exponential_moving_average: # Smooth curve
          alpha: 0.05
          send_every: 1
      - delta: 0.2 # Only send if changed more than 0.02V
      - round: 3 # Round digits
    on_value: 
      then:
        - component.update: batt_id

  - platform: template
    id: batt_id
    name: Battery
    device_class: battery
    unit_of_measurement: '%'
    accuracy_decimals: 0
    filters:
      - throttle: 3s
    lambda: |-
      auto v = id(batt_volt_id).state;
      float minv = 3.3;   // empty
      float maxv = 4.2;   // full
      auto level = ((v - minv) / (maxv - minv)) * 100.0;
      if(level > 100) level = 100;
      else if(level < 0) level = 0;
      return level;