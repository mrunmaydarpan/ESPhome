esphome:
  name: test
  friendly_name: test
  project: 
    name: MDtronix.4ch
    version: "3.0"
  comment: "4ch Smart Switch"
esp8266:
  board: d1_mini

# Enable logging
logger:

# Enable Home Assistant API
api:
ota:
  - platform: esphome
wifi:
  ap: {}

captive_portal:
web_server:
  version: 3

output:
  - platform: gpio
    pin: D4
    id: io_1

light:
  - platform: binary
    output: io_1
    id: light_1
    name: light test    

binary_sensor:
  - platform: gpio
    pin: D2
    id: switch_1
    on_state: 
      then:
        - lambda: |-
            if(id(io_1).state = true)
            {
              id(io_1).turn_off();
            } else {
              id(io_1).turn_on();
            }
            