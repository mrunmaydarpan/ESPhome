esphome:
  name: battery-test
  friendly_name: battery test

esp8266:
  board: d1_mini

logger:
api:
# mqtt:
#   broker: !secret broker
#   id: mqtt_id
#   discovery: false
#   # discover_ip: True
#   birth_message: 
#   will_message: 
  
ota:
  - platform: esphome
    on_begin:
      - deep_sleep.prevent: deepSleep
    on_end:
      - deep_sleep.allow: deepSleep  

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}
  fast_connect: True

captive_portal:
web_server:
  version: 3    

deep_sleep:
  id: deepSleep
  # run_duration: 30s
  sleep_duration: 5min
    
uart:
  tx_pin: D1
  rx_pin: D2
  baud_rate: 9600
  id: uart_id

sensor:
  - platform: "a02yyuw"
    name: "Distance"
    
  - platform: adc
    name: "Battery Voltage"
    id: batteryVoltage
    pin: A0
    update_interval: 2s
    filters:
      - multiply: 3.3       
      - calibrate_linear:
          # Map volts (from sensor) to % (for HA)
          - 0.0 -> 0.0
          - 0.957 -> 4.86
    device_class: voltage          
    # unit_of_measurement: "V"
    accuracy_decimals: 2
    on_value: 
      then:
        if:
          condition: api.connected
          then:
            - delay: 3s
            - deep_sleep.enter: deepSleep   
              
status_led:
  pin: 
    number: 2
    inverted: False

binary_sensor:
  - platform: status
    name: status
